services:
  - type: web
    name: bloquemundo-backend
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      # Las demás variables (DB_HOST, DB_USER, etc.) se configuran en el dashboard de Render
